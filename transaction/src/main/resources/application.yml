server:
  port: 0

spring:
  application:
    name: transaction
  datasource:
    url: jdbc:postgresql://localhost:5436/transaction
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/mywallet-realm
          jwk-set-uri: http://localhost:8081/realms/mywallet-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

kafka:
  bootstrap-servers: localhost:9092

keycloak:
  client-id: mywallet-client