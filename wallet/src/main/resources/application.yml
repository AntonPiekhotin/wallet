server:
  port: 0

spring:
  application:
    name: wallet
  datasource:
    url: jdbc:postgresql://localhost:5435/wallet
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

kafka:
  bootstrap-servers: localhost:9092
